<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiệm Chải Lông Mèo Kawaii</title>
    <style>
        :root {
            --primary-color: #f43f5e;
            --bg-color: #fff1f2;
        }
        body {
            background-color: #fff5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            user-select: none;
            color: #374151;
        }
        h1 {
            color: #e11d48;
            margin: 5px 0;
            font-size: 26px;
        }
        .main-container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.1);
            position: relative;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #ffe4e6;
            padding: 10px;
            border-radius: 14px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 14px;
            border: 2px dashed #fda4af;
            color: #881337;
        }
        .dashboard div span {
            color: #e11d48;
        }
        /* Canvas Stage */
        .stage-box {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 15px auto;
            background: var(--bg-color);
            border-radius: 50%;
            border: 5px solid #fb7185;
            box-shadow: inset 0 0 20px rgba(255, 182, 193, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .stage-box.angry {
            animation: shake 0.1s infinite;
            border-color: #ef4444;
            background-color: #fee2e2;
        }
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            25% { transform: translate(-2px, -2px) rotate(-1deg); }
            50% { transform: translate(-2px, 2px) rotate(1deg); }
            75% { transform: translate(2px, -2px) rotate(0deg); }
            100% { transform: translate(-2px, 2px) rotate(-1deg); }
        }
        .status-msg {
            font-size: 16px;
            font-weight: bold;
            height: 28px;
            margin-bottom: 15px;
            color: #6b7280;
        }
        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        #brush-btn {
            flex: 2;
            background: linear-gradient(135deg, #fb7185, #e11d48);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3);
            transition: transform 0.1s;
        }
        #brush-btn:active {
            transform: scale(0.96);
        }
        #shop-btn {
            flex: 1;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
        }
        /* Modal Shop */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.98);
            border-radius: 24px;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #e11d48;
        }
        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
        .shop-items {
            overflow-y: auto;
            flex: 1;
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-right: 5px;
        }
        .shop-item {
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
        }
        .shop-item.equipped {
            border-color: #f43f5e;
            background: #fff1f2;
        }
        .shop-item-name {
            font-size: 13px;
            font-weight: bold;
            margin: 5px 0;
        }
        .buy-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            width: 100%;
        }
        .buy-btn.equipped-btn {
            background: #f43f5e;
        }
        .buy-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>🐾 Tiệm Chải Mèo Kawaii 🐾</h1>
        <p style="font-size: 13px; color: #6b7280; margin-top: 0;">Chải lông thư giãn - Đừng để mèo hờn dỗi nhé!</p>

        <div class="dashboard">
            <div>Lông Tích Luỹ: <br><span id="currency">0</span> 🪮</div>
            <div>Điểm Hiện Tại: <br><span id="current-score">0</span></div>
            <div>Điểm Kỷ Lục: <br><span id="high-score">0</span></div>
            <div>Mạng Sống: <br><span id="lives">❤️❤️❤️</span></div>
        </div>

        <div class="stage-box" id="stage-box">
            <canvas id="catCanvas" width="240" height="240"></canvas>
        </div>

        <div class="status-msg" id="status-msg">Nhấn giữ nút bên dưới để Bắt Đầu!</div>

        <div class="controls">
            <button id="brush-btn" onmousedown="handleStart()" onmouseup="handleEnd()" ontouchstart="handleStart(event)" ontouchend="handleEnd(event)">GIỮ ĐỂ CHẢI</button>
            <button id="shop-btn" onclick="toggleShop(true)">🛍️ SHOP</button>
        </div>

        <!-- Shop Modal -->
        <div class="modal" id="shop-modal">
            <div class="modal-header">
                <div class="modal-title">🏪 Cửa Hàng Phụ Kiện</div>
                <button class="close-btn" onclick="toggleShop(false)">✕</button>
            </div>
            <div style="font-size: 13px; margin-top: 5px; text-align: left;">Lông hiện có: <b id="shop-currency" style="color: #e11d48;">0</b> 🪮</div>
            <div class="shop-items" id="shop-items-container"></div>
        </div>
    </div>

    <script>
        // --- ÂM THANH THƯ GIÃN (MỀM MẠI, ÊM ÁI) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let purrOsc = null, purrGain = null, purrLfo = null;

        function playRelaxingPurr() {
            if (purrOsc) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                // Sóng sine dịu nhẹ thay vì sóng thô
                purrOsc = audioCtx.createOscillator();
                purrGain = audioCtx.createGain();
                purrOsc.type = 'sine';
                purrOsc.frequency.setValueAtTime(38, audioCtx.currentTime); // Tần số trầm ấm thư giãn

                purrLfo = audioCtx.createOscillator();
                let lfoGain = audioCtx.createGain();
                purrLfo.frequency.setValueAtTime(2.5, audioCtx.currentTime); // Nhịp thở chậm rãi
                lfoGain.gain.setValueAtTime(5, audioCtx.currentTime);
                purrLfo.connect(lfoGain);
                lfoGain.connect(purrOsc.frequency);
                purrLfo.start();

                purrGain.gain.setValueAtTime(0.04, audioCtx.currentTime); // Âm lượng cực kỳ nhỏ, êm tai
                purrOsc.connect(purrGain);
                purrGain.connect(audioCtx.destination);
                purrOsc.start();
            } catch(e){}
        }

        function stopRelaxingPurr() {
            if (purrOsc) {
                try { 
                    purrOsc.stop(); purrOsc.disconnect(); 
                    if (purrLfo) { purrLfo.stop(); purrLfo.disconnect(); }
                } catch(e){}
                purrOsc = null;
                purrLfo = null;
            }
        }

        function playSoftChime() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nốt D5 du dương
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e){}
        }

        function playSoftMeow() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                // Tiếng kêu mèo hờn dỗi luyến láy nhẹ
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.5);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch(e){}
        }

        function playBuySound() {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e){}
        }

        // --- GAME STATE ---
        let score = 0;
        let currency = parseInt(localStorage.getItem('cat_currency')) || 0;
        let highScore = parseInt(localStorage.getItem('cat_highscore')) || 0;
        let lives = 3;
        let isPlaying = false;
        let isBrushing = false;
        let catState = "back";
        let gameTimer = null;
        let brushInterval = null;

        let inventory = JSON.parse(localStorage.getItem('cat_inventory')) || ['skin_calico'];
        let equippedSkin = localStorage.getItem('cat_equipped_skin') || 'skin_calico';
        let equippedAccessory = localStorage.getItem('cat_equipped_acc') || 'none';

        const shopCatalog = [
            { id: 'skin_calico', name: 'Mèo Tam Thể', type: 'skin', price: 0 },
            { id: 'skin_tabby', name: 'Mèo Vàng Ngọt', type: 'skin', price: 30 },
            { id: 'skin_siamese', name: 'Mèo Xiêm Cục Cưng', type: 'skin', price: 60 },
            { id: 'skin_black', name: 'Mèo Đen Tuyết', type: 'skin', price: 100 },
            { id: 'acc_glasses', name: 'Kính Hồng Cute', type: 'acc', price: 25 },
            { id: 'acc_round_glasses', name: 'Kính Tròn Xinh', type: 'acc', price: 40 },
            { id: 'acc_party_hat', name: 'Mũ Sinh Nhật', type: 'acc', price: 50 },
            { id: 'acc_bow', name: 'Nơ Đỏ Ngọt Ngào', type: 'acc', price: 35 }
        ];

        const canvas = document.getElementById('catCanvas');
        const ctx = canvas.getContext('2d');
        const stageBox = document.getElementById('stage-box');
        const statusMsg = document.getElementById('status-msg');
        const currencyEl = document.getElementById('currency');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const livesEl = document.getElementById('lives');
        const brushBtn = document.getElementById('brush-btn');

        updateStatsUI();

        // --- ĐỒ HỌA MÈO KAWAII SIÊU DỄ THƯƠNG ---
        function drawCat() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = 120, cy = 135;

            let mainColor = "#ffedd5", spotColor = "#f97316", lightColor = "#ffffff";
            if (equippedSkin === 'skin_tabby') {
                mainColor = "#fef9c3"; spotColor = "#ca8a04"; lightColor = "#fffef0";
            } else if (equippedSkin === 'skin_siamese') {
                mainColor = "#f5f5f4"; spotColor = "#78716c"; lightColor = "#fafaf9";
            } else if (equippedSkin === 'skin_black') {
                mainColor = "#334155"; spotColor = "#0f172a"; lightColor = "#475569";
            }

            if (catState === "back") {
                // Thân mèo lưng bầu bĩnh
                ctx.beginPath();
                ctx.ellipse(cx, cy + 15, 68, 75, 0, 0, Math.PI * 2);
                ctx.fillStyle = mainColor;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = spotColor;
                ctx.stroke();

                if (equippedSkin === 'skin_calico') {
                    ctx.beginPath();
                    ctx.ellipse(cx - 25, cy + 5, 25, 35, -0.2, 0, Math.PI * 2);
                    ctx.fillStyle = spotColor;
                    ctx.fill();
                }

                // Đầu mèo sau
                ctx.beginPath();
                ctx.arc(cx, cy - 45, 48, 0, Math.PI * 2);
                ctx.fillStyle = mainColor;
                ctx.fill();
                ctx.stroke();

                drawEar(cx - 38, cy - 72, mainColor, spotColor, true);
                drawEar(cx + 38, cy - 72, mainColor, spotColor, true);

                // Đuôi vẫy nhẹ nhàng thư giãn
                let tailWag = Math.sin(Date.now() / 250) * 0.25;
                ctx.save();
                ctx.translate(cx + 45, cy + 55);
                ctx.rotate(tailWag);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(35, -30, 20, -75);
                ctx.lineWidth = 15;
                ctx.lineCap = "round";
                ctx.strokeStyle = spotColor;
                ctx.stroke();
                ctx.restore();

            } else {
                // Mặt trước siêu kute
                ctx.beginPath();
                ctx.ellipse(cx, cy + 25, 65, 70, 0, 0, Math.PI * 2);
                ctx.fillStyle = mainColor;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = spotColor;
                ctx.stroke();

                // Bụng trắng
                ctx.beginPath();
                ctx.ellipse(cx, cy + 35, 38, 45, 0, 0, Math.PI * 2);
                ctx.fillStyle = lightColor;
                ctx.fill();

                // Đầu to tròn
                ctx.beginPath();
                ctx.arc(cx, cy - 35, 54, 0, Math.PI * 2);
                ctx.fillStyle = mainColor;
                ctx.fill();
                ctx.stroke();

                // Má hồng ửng rực rỡ (Blush)
                ctx.beginPath();
                ctx.arc(cx - 32, cy - 20, 14, 0, Math.PI * 2);
                ctx.arc(cx + 32, cy - 20, 14, 0, Math.PI * 2);
                ctx.fillStyle = "#fecdd3";
                ctx.fill();

                drawEar(cx - 42, cy - 65, mainColor, spotColor, false);
                drawEar(cx + 42, cy - 65, mainColor, spotColor, false);

                if (catState === "turning") {
                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(cx - 28, cy - 42, 16, 5);
                    ctx.fillRect(cx + 12, cy - 42, 16, 5);
                } else {
                    // Mắt long lanh anime
                    drawKawaiiEye(cx - 22, cy - 40);
                    drawKawaiiEye(cx + 22, cy - 40);
                }

                // Mũi trái tim hồng
                ctx.beginPath();
                ctx.moveTo(cx, cy - 23);
                ctx.lineTo(cx - 6, cy - 30);
                ctx.lineTo(cx + 6, cy - 30);
                ctx.closePath();
                ctx.fillStyle = "#e11d48";
                ctx.fill();

                // Miệng cười cute
                ctx.beginPath();
                ctx.arc(cx - 6, cy - 23, 6, 0, Math.PI);
                ctx.arc(cx + 6, cy - 23, 6, 0, Math.PI);
                ctx.strokeStyle = "#1e293b";
                ctx.lineWidth = 2.5;
                ctx.stroke();

                drawAccessories(ctx, cx, cy);
            }
        }

        function drawEar(x, y, mainColor, spotColor, isBack) {
            ctx.beginPath();
            ctx.moveTo(x - 22, y + 15);
            ctx.lineTo(x, y - 25);
            ctx.lineTo(x + 22, y + 15);
            ctx.fillStyle = mainColor;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = spotColor;
            ctx.stroke();

            if (!isBack) {
                ctx.beginPath();
                ctx.moveTo(x - 12, y + 8);
                ctx.lineTo(x, y - 15);
                ctx.lineTo(x + 12, y + 8);
                ctx.fillStyle = "#fbcfe8";
                ctx.fill();
            }
        }

        function drawKawaiiEye(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = "#1e293b";
            ctx.fill();

            // Đốm sáng long lanh
            ctx.beginPath();
            ctx.arc(x - 3, y - 3, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 3, y + 3, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
        }

        function drawAccessories(cx, cy) {
            if (equippedAccessory === 'acc_glasses') {
                ctx.fillStyle = "#f43f5e";
                ctx.fillRect(cx - 36, cy - 50, 32, 18);
                ctx.fillRect(cx + 4, cy - 50, 32, 18);
            } else if (equippedAccessory === 'acc_round_glasses') {
                ctx.strokeStyle = "#e11d48";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(cx - 22, cy - 40, 14, 0, Math.PI * 2);
                ctx.arc(cx + 22, cy - 40, 14, 0, Math.PI * 2);
                ctx.stroke();
            } else if (equippedAccessory === 'acc_party_hat') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - 120);
                ctx.lineTo(cx - 22, cy - 70);
                ctx.lineTo(cx + 22, cy - 70);
                ctx.fillStyle = "#f43f5e";
                ctx.fill();
            } else if (equippedAccessory === 'acc_bow') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - 8);
                ctx.lineTo(cx - 20, cy - 22);
                ctx.lineTo(cx - 20, cy + 4);
                ctx.fillStyle = "#f43f5e";
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(cx, cy - 8);
                ctx.lineTo(cx + 20, cy - 22);
                ctx.lineTo(cx + 20, cy + 4);
                ctx.fillStyle = "#f43f5e";
                ctx.fill();
            }
        }

        setInterval(() => { drawCat(); }, 40);

        // --- GAME LOGIC ---
        function startGame() {
            score = 0;
            lives = 3;
            isPlaying = true;
            updateStatsUI();
            brushBtn.innerText = "GIỮ ĐỂ CHẢI";
            scheduleCatBehavior();
        }

        function scheduleCatBehavior() {
            if (!isPlaying) return;

            catState = "back";
            stageBox.classList.remove("angry");
            statusMsg.innerText = "🌸 Mèo đang quay lưng... Chải lông thư giãn nào!";
            statusMsg.style.color = "#059669";

            let baseBackTime = Math.max(700, 2400 - (score * 35));
            let randomBackTime = baseBackTime + Math.random() * 1000;

            gameTimer = setTimeout(() => {
                if (!isPlaying) return;

                catState = "turning";
                statusMsg.innerText = "👀 Mèo ngó nghiêng! Chuẩn bị thả tay...";
                statusMsg.style.color = "#d97706";

                let turnSpeed = Math.max(200, 550 - (score * 12));

                gameTimer = setTimeout(() => {
                    if (!isPlaying) return;

                    catState = "front";
                    stageBox.classList.add("angry");
                    statusMsg.innerText = "😾 MÈO QUAY MẶT LẠI!";
                    statusMsg.style.color = "#dc2626";

                    if (isBrushing) {
                        punishPlayer();
                    }

                    let frontTime = 1100 + Math.random() * 700;

                    gameTimer = setTimeout(() => {
                        if (isPlaying) scheduleCatBehavior();
                    }, frontTime);

                }, turnSpeed);

            }, randomBackTime);
        }

        function handleStart(e) {
            if (e) e.preventDefault();
            if (!isPlaying) {
                startGame();
            }
            isBrushing = true;
            playRelaxingPurr();

            if (catState === "front") {
                punishPlayer();
                return;
            }

            if (!brushInterval) {
                brushInterval = setInterval(() => {
                    if (isBrushing && catState === "back") {
                        score++;
                        currency++;
                        if (score > highScore) highScore = score;
                        playSoftChime();
                        saveData();
                        updateStatsUI();
                    }
                }, 200);
            }
        }

        function handleEnd(e) {
            if (e) e.preventDefault();
            isBrushing = false;
            stopRelaxingPurr();
            if (brushInterval) {
                clearInterval(brushInterval);
                brushInterval = null;
            }
        }

        function punishPlayer() {
            handleEnd();
            playSoftMeow();
            lives--;
            updateStatsUI();

            if (lives <= 0) {
                gameOver();
            } else {
                statusMsg.innerText = "😿 Bị bắt quả tang! Mèo hờn dỗi mất 1 tim!";
            }
        }

        function gameOver() {
            isPlaying = false;
            clearTimeout(gameTimer);
            handleEnd();
            stageBox.classList.add("angry");
            statusMsg.innerText = "💔 THUA RỒI! Mèo quá giận dỗi bạn!";
            statusMsg.style.color = "#dc2626";
            brushBtn.innerText = "CHƠI LẠI";
        }

        function updateStatsUI() {
            currencyEl.innerText = currency;
            currentScoreEl.innerText = score;
            highScoreEl.innerText = highScore;
            livesEl.innerText = "❤️".repeat(Math.max(0, lives));
        }

        function saveData() {
            localStorage.setItem('cat_currency', currency);
            localStorage.setItem('cat_highscore', highScore);
            localStorage.setItem('cat_inventory', JSON.stringify(inventory));
            localStorage.setItem('cat_equipped_skin', equippedSkin);
            localStorage.setItem('cat_equipped_acc', equippedAccessory);
        }

        // --- SHOP ---
        function toggleShop(open) {
            const modal = document.getElementById('shop-modal');
            modal.style.display = open ? 'flex' : 'none';
            if (open) renderShop();
        }

        function renderShop() {
            document.getElementById('shop-currency').innerText = currency;
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';

            shopCatalog.forEach(item => {
                const isOwned = inventory.includes(item.id);
                const isEquipped = (item.type === 'skin' && equippedSkin === item.id) || 
                                   (item.type === 'acc' && equippedAccessory === item.id);

                const div = document.createElement('div');
                div.className = `shop-item ${isEquipped ? 'equipped' : ''}`;
                div.innerHTML = `
                    <div class="shop-item-name">${item.name}</div>
                    <div style="font-size: 12px; color: #6b7280; margin-bottom: 5px;">
                        ${isOwned ? 'Đã có' : item.price + ' 🪮'}
                    </div>
                    <button class="buy-btn ${isEquipped ? 'equipped-btn' : ''}" 
                        ${!isOwned && currency < item.price ? 'disabled' : ''}
                        onclick="buyOrEquip('${item.id}')">
                        ${isEquipped ? 'Đang Dùng' : (isOwned ? 'Dùng' : 'Mua')}
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function buyOrEquip(itemId) {
            const item = shopCatalog.find(i => i.id === itemId);
            if (!item) return;

            if (!inventory.includes(itemId)) {
                if (currency >= item.price) {
                    currency -= item.price;
                    inventory.push(itemId);
                    playBuySound();
                } else return;
            }

            if (item.type === 'skin') equippedSkin = itemId;
            else if (item.type === 'acc') equippedAccessory = (equippedAccessory === itemId) ? 'none' : itemId;

            saveData();
            updateStatsUI();
            renderShop();
        }
    </script>
</body>
    </html>
